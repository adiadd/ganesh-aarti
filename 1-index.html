<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ganesha Aarti</title>
<style>
  :root {
    --paper: #faf5ec;
    --ink: #3d1a08;
    --accent: #b3500e;
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    padding: 48px 20px 64px;
  }
  .om { text-align: center; font-size: 34px; color: var(--accent); }
  h1 {
    text-align: center;
    font-size: 34px;
    font-weight: 600;
    letter-spacing: 0.04em;
    margin: 10px 0 6px;
  }
  .sub {
    text-align: center;
    font-style: italic;
    color: #7a5a40;
    margin-bottom: 40px;
  }
  .cards {
    display: flex;
    flex-direction: column;
    gap: 22px;
    max-width: 420px;
    margin: 0 auto;
  }
  .card {
    background: var(--card);
    border: 1px solid #e8dcc8;
    border-radius: 14px;
    padding: 26px 22px;
    text-align: center;
    box-shadow: 0 2px 10px rgba(61, 26, 8, 0.06);
  }
  .card h2 { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
  .card .native { color: #7a5a40; font-size: 16px; margin-bottom: 18px; }
  .card img {
    width: 180px;
    height: 180px;
    display: block;
    margin: 0 auto 18px;
  }
  .card a {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-size: 17px;
    padding: 12px 30px;
    border-radius: 999px;
  }
  .card a:active { background: #94400b; }
  footer {
    text-align: center;
    margin-top: 44px;
    color: #a08668;
    font-size: 14px;
    font-style: italic;
  }
  @media (min-width: 720px) {
    .cards { flex-direction: row; max-width: 1000px; justify-content: center; }
    .card { flex: 1; max-width: 300px; }
  }
</style>
</head>
<body>
  <div class="om">&#x1F6D5;</div>
  <h1>Ganesha Aarti</h1>
  <p class="sub">scan or tap to open the aarti in your language</p>
  <div class="cards">
    <div class="card">
      <h2>Telugu</h2>
      <p class="native">&#x0C24;&#x0C46;&#x0C32;&#x0C41;&#x0C17;&#x0C41;</p>
      <img src="qr-telugu.png" alt="QR code for the Telugu aarti PDF">
      <a href="telugu.pdf">Open PDF</a>
    </div>
    <div class="card">
      <h2>Hindi</h2>
      <p class="native">&#x0939;&#x093F;&#x0928;&#x094D;&#x0926;&#x0940;</p>
      <img src="qr-hindi.png" alt="QR code for the Hindi aarti PDF">
      <a href="hindi.pdf">Open PDF</a>
    </div>
    <div class="card">
      <h2>English</h2>
      <p class="native">transliteration</p>
      <img src="qr-english.png" alt="QR code for the English aarti PDF">
      <a href="english.pdf">Open PDF</a>
    </div>
  </div>
  <footer>adiadd.github.io/ganesh-aarti</footer>
</body>
</html>
